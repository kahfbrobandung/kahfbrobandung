name: Cek Kode Otomatis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil kode terbaru
      uses: actions/checkout@v4

    - name: 2. Siapkan pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: 3. Siapkan Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 4. Install semua paket
      run: pnpm install --no-frozen-lockfile

    - name: 5. Tes Build Frontend (Cari Typo)
      run: pnpm --filter @workspace/stock-opname build
